server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: pine-wilt-detection

  # H2内存数据库（开发模式，无需安装MySQL）
  datasource:
    url: jdbc:h2:mem:pinewiltdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  # 文件上传限制
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.pinewilt.detection.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Python推理服务地址
inference:
  server:
    url: http://localhost:8000
    timeout: 30000

# 文件存储路径
file:
  upload:
    path: ./uploads
  result:
    path: ./results

logging:
  level:
    com.pinewilt: DEBUG
    org.springframework.web: INFO
